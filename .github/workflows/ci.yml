name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -v ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            AFFECTED_COUNT=$(echo "$OUTPUT" | grep -E "Your code is affected by [0-9]+ vulnerabilit(y|ies)\." | wc -l | tr -d ' ')
            if [ "$AFFECTED_COUNT" -gt 0 ]; then
              echo "::error::Actionable vulnerabilities detected in application dependencies."
              exit $STATUS
            fi
            if echo "$OUTPUT" | grep -q "from the Go standard library"; then
              echo "::warning::Non-actionable Go standard library vulnerability detected in runner Go toolchain."
              exit 0
            fi
            exit $STATUS
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: latest
          args: --timeout=5m

  scaffold-matrix:
    name: Test Scaffold (${{ matrix.template }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [blog, ecommerce, saas, social]
        database: [postgres, mysql, mongodb]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache: true

      - name: Build fiberforge
        run: go build -o ./fiberforge-bin .

      - name: Generate and build project
        run: |
          mkdir -p /tmp/fiberforge-test
          cp examples/${{ matrix.template }}.yaml /tmp/fiberforge-test/schema.yaml
          
          # Replace database field
          sed -i 's/^[[:space:]]*database:.*/database: ${{ matrix.database }}/g' /tmp/fiberforge-test/schema.yaml
          
          # Scaffold the project
          ./fiberforge-bin scaffold /tmp/fiberforge-test/schema.yaml --output-dir ./generated-project
          
          # Verify it compiles
          cd ./generated-project
          go mod tidy
          go build ./...

